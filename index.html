// ── POPUP ──
(function(){
  const popup = document.getElementById('openingSoonPopup');
  if(!popup || !CONFIG.popupShow) return;
  if(sessionStorage.getItem('popupDismissed')){ popup.classList.add('hidden'); return; }
  function dismiss(){ popup.classList.add('hidden'); sessionStorage.setItem('popupDismissed','1'); }
  document.getElementById('popupClose').addEventListener('click', dismiss);
  document.getElementById('popupBtn2').addEventListener('click', dismiss);
  document.getElementById('popupBtn1').addEventListener('click', dismiss);
  popup.addEventListener('click', function(e){ if(e.target===popup) dismiss(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') dismiss(); });
})();

const revs = document.querySelectorAll('.reveal');
function check(){
  const vh = window.innerHeight;
  revs.forEach(el=>{ if(el.getBoundingClientRect().top < vh-60) el.classList.add('on'); });
}
window.addEventListener('scroll', check, {passive:true});
check();

if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.querySelectorAll('.marquee-track').forEach(el=>el.style.animation='none');
  document.querySelectorAll('.blob,.shape-blob,.callout-float,.shop-blob,.tag-dot,.spin-star').forEach(el=>el.style.animation='none');
  revs.forEach(el=>{el.style.opacity='1';el.style.transform='none';el.style.transition='none';});
}
</script>
