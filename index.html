/* ── PALETTE
   Orange  #E8642B  from logo shield body
   Blue    #2E5F8A  from logo header band
   Green   #4E7D62  sage complement
   Ink     #1C3349  deep navy (replaces all black)
   Stone neutrals: no black anywhere
── */
const css = `
  :root{
    --orange:    #E8642B;
    --orange-dk: #C9521E;
    --orange-lt: #FAEBE2;
    --blue:      #2E5F8A;
    --blue-dk:   #1E4264;
    --blue-lt:   #DBE9F5;
    --green:     #4E7D62;
    --green-dk:  #315040;
    --green-lt:  #D9ECE3;
    --ink:       #1C3349;
    --white:     #FAF8F5;
    --stone:     #F0EDE8;
    --stone-md:  #E2DDD6;
    --stone-dk:  #C0BAB1;
    --muted:     #7A7267;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:'Nunito',sans-serif;background:var(--white);color:var(--ink);overflow-x:hidden;}

  nav{position:fixed;top:0;left:0;right:0;z-index:200;height:58px;background:var(--orange);display:flex;align-items:center;justify-content:space-between;padding:0 2.5rem;border-bottom:3px solid var(--orange-dk);}
  .nav-logo{font-family:'Fredoka One',cursive;font-size:1.3rem;color:#fff;text-decoration:none;letter-spacing:.02em;}
  .nav-links{display:flex;gap:.15rem;list-style:none;}
  .nav-links a{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.8);text-decoration:none;padding:.35rem .75rem;border-radius:20px;transition:background .2s,color .2s;}
  .nav-links a:hover{background:rgba(255,255,255,.2);color:#fff;}

  #hero{min-height:100vh;background:var(--orange);border-bottom:3px solid var(--orange-dk);padding:80px 3rem 3rem;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;}
  .blob{position:absolute;border-radius:50%;pointer-events:none;}
  .blob-1{width:180px;height:180px;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.28);top:70px;right:6%;animation:float1 6s ease-in-out infinite;}
  .blob-2{width:130px;height:130px;background:var(--blue);border:3px solid var(--blue-dk);opacity:.6;bottom:80px;right:18%;animation:float2 5s ease-in-out infinite;}
  .blob-3{width:90px;height:90px;background:var(--green);border:3px solid var(--green-dk);opacity:.55;top:55%;right:32%;animation:float1 7s ease-in-out infinite 1s;}
  .blob-4{width:70px;height:70px;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.22);bottom:160px;right:42%;animation:float2 4.5s ease-in-out infinite .5s;}
  .blob-5{width:150px;height:150px;background:var(--blue-dk);border:3px solid var(--blue-dk);opacity:.45;bottom:40px;right:3%;animation:float1 8s ease-in-out infinite 2s;}
  @keyframes float1{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-22px) rotate(5deg);}}
  @keyframes float2{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-16px) rotate(-6deg);}}
  .spin-star{position:absolute;top:75px;right:4%;width:65px;height:65px;animation:spin 12s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .hero-tag{display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.18);color:#fff;border:2px solid rgba(255,255,255,.38);border-radius:30px;font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.4rem 1.1rem;width:fit-content;margin-bottom:1.5rem;animation:wiggle 3s ease-in-out infinite;}
  @keyframes wiggle{0%,100%{transform:rotate(-1deg);}50%{transform:rotate(1.5deg);}}
  .tag-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.4);}}
  .hero-h1{font-family:'Fredoka One',cursive;font-size:clamp(2.8rem,7vw,6.5rem);line-height:.92;color:#fff;letter-spacing:-.01em;position:relative;z-index:1;margin-bottom:1.5rem;}
  .hero-h1 .outline{-webkit-text-stroke:3px rgba(255,255,255,.55);color:transparent;}
  .hero-h1 .blue-word{color:var(--blue-lt);display:inline-block;animation:bounce-word 2s ease-in-out infinite;}

  .hero-sub{font-size:1rem;font-weight:700;color:rgba(255,255,255,.88);max-width:480px;line-height:1.7;position:relative;z-index:1;margin-bottom:1.5rem;}
  .hero-sub strong{color:#fff;}
  .hero-btns{display:flex;gap:1rem;flex-wrap:wrap;position:relative;z-index:1;}

  .btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding:.75rem 1.8rem;border-radius:30px;transition:transform .2s,box-shadow .2s;display:inline-block;}
  .btn:hover{transform:translateY(-3px);}
  .btn-white{background:#fff;color:var(--ink);border:2.5px solid var(--stone-dk);}
  .btn-white:hover{box-shadow:4px 4px 0 var(--stone-dk);}
  .btn-blue{background:var(--blue);color:#fff;border:2.5px solid var(--blue-dk);}
  .btn-blue:hover{box-shadow:4px 4px 0 var(--blue-dk);}
  .btn-ink{background:var(--ink);color:#fff;border:2.5px solid var(--blue-dk);}
  .btn-ink:hover{box-shadow:4px 4px 0 var(--blue-dk);}

  .marquee-wrap{overflow:hidden;background:var(--blue);border-top:3px solid var(--blue-dk);border-bottom:3px solid var(--blue-dk);padding:.65rem 0;}
  .marquee-track{display:flex;width:max-content;animation:marquee 20s linear infinite;}
  .marquee-item{font-family:'Fredoka One',cursive;font-size:1.1rem;letter-spacing:.06em;color:#fff;white-space:nowrap;padding:0 1.5rem;}
  .marquee-sep{color:var(--orange);margin:0 .25rem;}
  @keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  #hours{background:var(--white);padding:6rem 3rem;position:relative;overflow:hidden;}
  .hours-inner{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1.3fr;gap:5rem;align-items:start;}
  .section-eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;display:inline-flex;align-items:center;gap:.5rem;margin-bottom:1rem;}
  .pill{color:#fff;border-radius:20px;padding:.2rem .75rem;font-family:'Fredoka One',cursive;font-size:.8rem;letter-spacing:.05em;}
  .pill-orange{background:var(--orange);border:2px solid var(--orange-dk);}
  .pill-blue  {background:var(--blue);  border:2px solid var(--blue-dk);}
  .pill-green {background:var(--green); border:2px solid var(--green-dk);}
  .section-h2{font-family:'Fredoka One',cursive;font-size:clamp(2.5rem,5vw,4.5rem);line-height:.95;color:var(--ink);margin-bottom:1rem;letter-spacing:-.01em;}
  .section-h2 em{font-style:normal;color:var(--orange);}
  .section-h2 em.blue {color:var(--blue);}
  .section-h2 em.green{color:var(--green);}
  .section-desc{font-size:.97rem;color:var(--muted);line-height:1.85;font-weight:600;margin-bottom:2rem;max-width:340px;}
  .location-card{background:var(--blue-lt);border:2.5px solid var(--blue);border-radius:18px;padding:1.5rem 1.75rem;box-shadow:5px 5px 0 var(--blue);}
  .location-card p{font-size:.92rem;font-weight:700;line-height:2;color:var(--ink);}
  .location-card a{color:var(--blue);text-decoration:none;}
  .hours-rows{display:flex;flex-direction:column;}
  .hour-row{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 0;border-bottom:2px solid var(--stone-md);}
  .hour-row:first-child{border-top:2px solid var(--stone-md);}
  .hour-day{font-size:.85rem;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}
  .hour-time{font-family:'Fredoka One',cursive;font-size:1.6rem;color:var(--ink);display:flex;align-items:center;gap:.75rem;}
  .best-pill{font-family:'Nunito',sans-serif;font-size:.58rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--orange);color:#fff;border:1.5px solid var(--orange-dk);border-radius:20px;padding:.2rem .6rem;}
  .shape-blob{position:absolute;border-radius:50%;pointer-events:none;}

  .callout-band{background:var(--blue);border-top:3px solid var(--blue-dk);border-bottom:3px solid var(--blue-dk);padding:5rem 3rem;position:relative;overflow:hidden;}
  .callout-band-inner{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;}
  .callout-band h2{font-family:'Fredoka One',cursive;font-size:clamp(3rem,6vw,6rem);line-height:.92;color:#fff;}
  .callout-band h2 em{font-style:normal;color:var(--orange);}
  .callout-band p{font-size:1rem;color:rgba(255,255,255,.75);line-height:1.85;font-weight:600;}
  .callout-float{position:absolute;border-radius:50%;background:rgba(255,255,255,.06);}

  #donations{background:var(--stone);border-top:3px solid var(--stone-dk);padding:6rem 3rem;position:relative;overflow:hidden;}
  .donations-inner{max-width:1100px;margin:0 auto;}
  .donations-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:3.5rem;flex-wrap:wrap;gap:2rem;}
  .donations-top p{max-width:340px;font-size:.95rem;color:var(--muted);line-height:1.8;font-weight:600;}
  .accept-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;}
  .accept-card{background:var(--white);border:2.5px solid var(--stone-dk);border-radius:18px;padding:1.8rem;box-shadow:4px 4px 0 var(--stone-dk);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;}
  .accept-card:hover{transform:translateY(-4px) translateX(-2px);box-shadow:6px 6px 0 var(--stone-dk);}
  .accept-card.no{background:var(--stone-md);box-shadow:none;border-color:var(--stone-dk);opacity:.55;}
  .card-status{font-size:.62rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:.75rem;display:flex;align-items:center;gap:.4rem;}
  .card-status.yes{color:var(--green);}
  .card-status.no-txt{color:var(--muted);}
  .accept-card h4{font-family:'Fredoka One',cursive;font-size:1.5rem;color:var(--ink);margin-bottom:.4rem;}
  .accept-card p{font-size:.85rem;color:var(--muted);line-height:1.7;font-weight:600;}
  .corner{position:absolute;bottom:-16px;right:-16px;width:60px;height:60px;border-radius:50%;opacity:.18;}
  .corner-o{background:var(--orange);}
  .corner-b{background:var(--blue);}
  .corner-g{background:var(--green);}

  #about{background:var(--white);border-top:3px solid var(--stone-dk);padding:6rem 3rem;position:relative;overflow:hidden;}
  .about-inner{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6rem;align-items:center;}
  .about-text p{font-size:.97rem;color:var(--muted);line-height:1.9;font-weight:600;margin-bottom:1rem;}
  .about-text a{font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);text-decoration:none;border-bottom:2px solid var(--blue);padding-bottom:.15rem;display:inline-block;margin-top:1rem;transition:opacity .2s;}
  .about-text a:hover{opacity:.65;}
  .stats-grid{display:flex;flex-direction:column;gap:1rem;}
  .stat-card{background:var(--stone);border:2.5px solid var(--stone-dk);border-radius:16px;padding:1.4rem 1.6rem;box-shadow:4px 4px 0 var(--stone-dk);display:flex;align-items:center;gap:1.25rem;transition:transform .2s;}
  .stat-card:hover{transform:translateX(4px);}
  .stat-num{font-family:'Fredoka One',cursive;font-size:2.5rem;line-height:1;flex-shrink:0;}
  .stat-lbl{font-size:.82rem;font-weight:800;color:var(--muted);line-height:1.4;}
  .c-orange{color:var(--orange);} .c-blue{color:var(--blue);} .c-green{color:var(--green);}

  #shop{background:var(--green-lt);border-top:3px solid var(--green);border-bottom:3px solid var(--green);padding:6rem 3rem;position:relative;overflow:hidden;}
  .shop-inner{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:3.5rem;align-items:center;}
  .shop-blob{position:absolute;border-radius:50%;pointer-events:none;}
  .shop-blob-1{width:110px;height:110px;background:var(--white);border:3px solid var(--stone-dk);top:40px;right:10%;animation:float1 6s ease-in-out infinite;}
  .shop-blob-2{width:70px;height:70px;background:var(--green);border:3px solid var(--green-dk);opacity:.22;top:120px;right:22%;animation:float2 5s ease-in-out infinite .5s;}
  .shop-blob-3{width:55px;height:55px;background:var(--white);border:3px solid var(--stone-dk);bottom:60px;right:14%;animation:float1 7s ease-in-out infinite 1s;}
  .shop-blob-4{width:85px;height:85px;background:var(--orange);border:3px solid var(--orange-dk);opacity:.16;bottom:30px;right:28%;animation:float2 4.5s ease-in-out infinite 1.5s;}
  .shop-visual{width:200px;height:200px;flex-shrink:0;background:var(--white);border:2.5px solid var(--green);border-radius:20px;box-shadow:5px 5px 0 var(--green);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;z-index:1;}
  .shop-visual.has-photo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:18px;}
  .shop-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;width:100%;padding:1.25rem;}
  .shop-paw-sm{width:44px;height:44px;opacity:.22;flex-shrink:0;}
  .shop-label{font-family:'Fredoka One',cursive;font-size:1rem;color:var(--green);text-align:center;line-height:1.3;}

  footer{background:var(--ink);padding:4rem 3rem 2.5rem;}
  .foot-top{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr;gap:4rem;padding-bottom:3rem;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:2rem;}
  .foot-brand-name{font-family:'Fredoka One',cursive;font-size:1.6rem;color:#fff;display:block;margin-bottom:.75rem;}
  .foot-brand-name span{color:var(--orange);}
  .foot-brand p{font-size:.82rem;color:rgba(255,255,255,.4);line-height:1.9;}
  .foot-brand a{color:var(--orange);text-decoration:none;}
  .foot-col h5{font-size:.62rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:1.2rem;}
  .foot-col ul{list-style:none;}
  .foot-col li{margin-bottom:.5rem;}
  .foot-col a{font-size:.88rem;color:rgba(255,255,255,.52);text-decoration:none;font-weight:700;transition:color .2s;}
  .foot-col a:hover{color:#fff;}
  .foot-bottom{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
  .foot-bottom p{font-size:.75rem;color:rgba(255,255,255,.22);}
  .foot-social{display:flex;gap:.5rem;}
  .foot-social a{width:34px;height:34px;border:1px solid rgba(255,255,255,.16);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;color:rgba(255,255,255,.45);text-decoration:none;transition:background .2s,color .2s,border-color .2s;}
  .foot-social a:hover{background:var(--orange);color:#fff;border-color:var(--orange);}

  .reveal{opacity:0;transform:translateY(28px);transition:opacity .65s ease,transform .65s ease;}
  .reveal.on{opacity:1;transform:none;}
  .r1{transition-delay:.1s;}.r2{transition-delay:.2s;}.r3{transition-delay:.3s;}

  @media(max-width:860px){
    nav{padding:0 1.25rem;}
    #hero{padding:90px 1.5rem 4rem;}
    #hours,#donations,#about,#shop{padding:4rem 1.5rem;}
    .callout-band{padding:3.5rem 1.5rem;}
    footer{padding:3rem 1.5rem 2rem;}
    .hours-inner,.callout-band-inner,.about-inner,.shop-inner{grid-template-columns:1fr;gap:3rem;}
    .accept-grid{grid-template-columns:1fr 1fr;}
    .foot-top{grid-template-columns:1fr;gap:2.5rem;}
    .donations-top{flex-direction:column;}
    .hero-h1{font-size:clamp(2.4rem,10vw,4rem);}
    .blob-3,.blob-4,.blob-5{display:none;}
    .spin-star{display:none;}
  }
  @media(max-width:560px){
    .accept-grid{grid-template-columns:1fr;}
    .nav-links{display:none;}
  }
`;

document.head.insertAdjacentHTML('beforeend', `<style>${css}</style>`);
document.title = CONFIG.storeName + ' — Bend, Oregon';

const hoursHTML = CONFIG.hours.map(h => `
  <div class="hour-row">
    <span class="hour-day">${h.day}</span>
    <span class="hour-time">${h.time}${h.best ? ' <span class="best-pill">Best Day</span>' : ''}</span>
  </div>`).join('');

const corners = ['corner corner-o','corner corner-b','corner corner-g'];
const donationHTML = CONFIG.donationItems.map((item, i) => `
  <div class="accept-card${item.accepted ? '' : ' no'} reveal r${(i%3)+1}">
    <div class="card-status ${item.accepted ? 'yes' : 'no-txt'}">${item.accepted ? '✦ Accepted' : '✕ Not Accepted'}</div>
    <h4>${item.title}</h4>
    <p>${item.desc}</p>
    ${item.accepted ? `<div class="${corners[i%3]}"></div>` : ''}
  </div>`).join('');

const marqueeItems = [...CONFIG.marqueeItems, ...CONFIG.marqueeItems].map(item =>
  `<span class="marquee-item">${item} <span class="marquee-sep">✦</span></span>`).join('');

const calloutWords = CONFIG.calloutHeadline.split(' ');
const calloutH2 = `${calloutWords.slice(0,-1).join(' ')}<br><em>${calloutWords.at(-1)}</em>`;

const hoursWords = CONFIG.hoursHeadline.split(' ');

const revs = document.querySelectorAll('.reveal');
function check(){
  const vh = window.innerHeight;
  revs.forEach(el=>{ if(el.getBoundingClientRect().top < vh-60) el.classList.add('on'); });
}
window.addEventListener('scroll', check, {passive:true});
check();
