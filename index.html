  .foot-bottom{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}

// Reveal on scroll
const revs = document.querySelectorAll('.reveal');
function check(){
  const vh = window.innerHeight;
  revs.forEach(el=>{ if(el.getBoundingClientRect().top < vh-60) el.classList.add('on'); });
}
window.addEventListener('scroll', check, {passive:true});
check();

// Respect prefers-reduced-motion
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.querySelectorAll('.marquee-track').forEach(el=>el.style.animation='none');
  document.querySelectorAll('.blob,.shape-blob,.callout-float,.shop-blob,.tag-dot,.spin-star').forEach(el=>el.style.animation='none');
  revs.forEach(el=>{el.style.opacity='1';el.style.transform='none';el.style.transition='none';});
}
